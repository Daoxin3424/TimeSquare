<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Personal Experience &amp; Exploration</title>
<style>
  :root{
    --ink:#1c2a24;
    --paper:#f2ede1;
    --moss:#5b7360;
    --brass:#b08442;
    --line:#cabfa6;
    --shadow:rgba(28,42,36,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* subtle contour texture */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.05;
    background-image:radial-gradient(circle at 50% 50%,transparent 60%,var(--moss) 61%,transparent 62%),
      radial-gradient(circle at 50% 50%,transparent 40%,var(--moss) 41%,transparent 42%),
      radial-gradient(circle at 50% 50%,transparent 20%,var(--moss) 21%,transparent 22%);
    background-size:340px 340px;background-position:center;
  }
  .wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 20px}

  /* ---- header ---- */
  header{padding:64px 0 40px;text-align:center}
  .eyebrow{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    letter-spacing:.28em;text-transform:uppercase;font-size:11px;
    color:var(--brass);margin-bottom:18px;
  }
  .coord{display:inline-flex;align-items:center;gap:8px}
  .coord::before,.coord::after{content:"";width:26px;height:1px;background:var(--line)}
  h1{
    font-size:clamp(38px,11vw,68px);font-weight:400;line-height:.98;
    letter-spacing:-.01em;margin-bottom:16px;
  }
  h1 em{font-style:italic;color:var(--moss)}
  .lede{max-width:44ch;margin:0 auto;font-size:16px;line-height:1.55;color:#4a564d}

  /* ---- gallery ---- */
  .gallery{padding:12px 0 40px;display:flex;flex-direction:column;gap:64px}
  figure{position:relative}
  .num{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;
    color:var(--brass);letter-spacing:.1em;display:block;margin-bottom:10px;
  }
  .frame{
    position:relative;border:1px solid var(--line);background:#fff;
    padding:12px;box-shadow:0 18px 40px -22px var(--shadow);
    transition:transform .5s cubic-bezier(.2,.7,.2,1),opacity .5s;
  }
  .frame img{
    display:block;width:100%;height:auto;background:#e6dfce;
    aspect-ratio:4/3;object-fit:cover;
  }
  /* reveal on scroll */
  .reveal{opacity:0;transform:translateY(28px)}
  .reveal.in{opacity:1;transform:none}

  /* ---- footer ---- */
  footer{
    text-align:center;padding:48px 0 72px;border-top:1px solid var(--line);
    margin-top:24px;
  }
  footer .tap{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;color:#8a8674;
  }
  footer .tap span{color:var(--brass)}

  @media (prefers-reduced-motion:reduce){
    .reveal{opacity:1;transform:none;transition:none}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="reveal">
      <div class="eyebrow"><span class="coord">Getting to know you</span></div>
      <h1>Personal experience<br>&amp; exploration</h1>
    </header>

    <div class="gallery">
      <figure class="reveal">
        <span class="num">01</span>
        <div class="frame">
          <img src="image1.JPG" alt="Memory 1">
        </div>
      </figure>
    </div>

    <footer class="reveal">
      <p class="tap">Tap another marker on the map <span>·</span> explore more memories</p>
    </footer>
  </div>

<script>
  const io=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}});
  },{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
</body>
</html>
